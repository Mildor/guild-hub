name: guild-hub-dev

services:
    db:
        image: postgres:15-alpine
        container_name: guild-hub-db-dev
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: guild-hub
        ports:
            - "5432:5432"
        volumes:
            - pgdata_dev:/var/lib/postgresql/data
        networks:
            - guild-hub-dev-network

    redis:
        image: redis:7-alpine
        container_name: guild-hub-redis-dev
        ports:
            - "6379:6379"
        networks:
            - guild-hub-dev-network

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: guild-hub-backend-dev
        environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/guild-hub
            DB_HOST: db
            DB_PORT: 5432
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            DB_NAME: guild-hub
            REDIS_HOST: redis
            REDIS_PORT: 6379
        ports:
            - "3000:3000"
        volumes:
            - ./backend:/app
            - /app/node_modules
        depends_on:
            - db
            - redis
        networks:
            - guild-hub-dev-network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: guild-hub-frontend-dev
        ports:
            - "8073:8073"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - backend
        networks:
            - guild-hub-dev-network

    adminer:
        image: adminer
        container_name: guild-hub-adminer-dev
        environment:
            ADMINER_DEFAULT_SERVER: db
        ports:
            - "5051:8080"
        depends_on:
            - db
        networks:
            - guild-hub-dev-network

networks:
    guild-hub-dev-network:
        driver: bridge

volumes:
    pgdata_dev:
