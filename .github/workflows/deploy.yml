name: "Déploiement Production"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Rendre le script exécutable
        run: chmod +x ./mep.sh

      - name: Copier les fichiers .env de production
        run: |
          cp /home/server/Projects/guild-hub/backend/.env.prod /home/server/Projects/guild-hub/backend/.env.prod
          cp /home/server/Projects/guild-hub/frontend/.env /home/server/Projects/guild-hub/frontend/.env


      - name: Lancer la mise en production
        run: bash ./mep.sh
